  @font-face{font-family:"Cairo";font-style:normal;font-weight:600;font-display:swap;src:url("Cairo-600.woff") format("woff")}
  @font-face{font-family:"Cairo";font-style:normal;font-weight:700;font-display:swap;src:url("Cairo-700.woff") format("woff")}
  @font-face{font-family:"Cairo";font-style:normal;font-weight:900;font-display:swap;src:url("Cairo-900.woff") format("woff")}
  @font-face{font-family:"Tajawal";font-style:normal;font-weight:400;font-display:swap;src:url("Tajawal-400.woff") format("woff")}
  @font-face{font-family:"Tajawal";font-style:normal;font-weight:500;font-display:swap;src:url("Tajawal-500.woff") format("woff")}
  @font-face{font-family:"Tajawal";font-style:normal;font-weight:700;font-display:swap;src:url("Tajawal-700.woff") format("woff")}

    --cyan:#29B5E6; --cyan-600:#1B95C7; --cyan-700:#1378A4; --cyan-50:#E6F6FC;
    --ink:#0E1116; --text:#F4F8FB; --muted:#BCCEDA; --line:rgba(41,181,230,.28);

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:dark;background:var(--bg-bot);

  img,svg{-webkit-user-drag:none;user-drag:none}
  body{margin:0;min-height:100vh;min-height:100dvh;font-family:var(--font);color:var(--text);line-height:1.7;display:flex;flex-direction:column;

    background:radial-gradient(1100px 620px at 50% -6%,rgba(41,181,230,.30),transparent 68%),

  a{color:inherit;-webkit-tap-highlight-color:transparent}

  .skip{position:absolute;top:8px;inset-inline-start:16px;background:#FFC800;color:#000;padding:8px 14px;border-radius:8px;z-index:30;transform:translateY(-250%)}
  .skip:focus{transform:none}
  main{flex:1;display:grid;place-items:center;position:relative;z-index:1;
    padding-block:calc(36px + env(safe-area-inset-top,0px)) 28px;
    padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

  .sections{list-style:none;margin:20px auto 22px;padding:0;display:flex;justify-content:center;align-items:center;gap:clamp(18px,5vw,44px)}

  .sections .sep{width:2px;height:clamp(46px,9vw,64px);border-radius:2px;

  .illus{display:block;width:min(17rem,62vw);height:auto;margin:0 auto 22px;overflow:visible;filter:drop-shadow(0 0 18px rgba(41,181,230,.3))}

  /* علامة مائية: ترس ومفك مموّهان */

  .wm svg{position:absolute;inset:0;width:100%;height:100%;opacity:.22;filter:blur(1.2px)}
  footer{position:relative;z-index:1}

  h1,.card h2,.social h2{font-family:var(--font-head)}
  h1{font-size:clamp(1.6rem,4.6vw,2.6rem);line-height:1.35;margin:0 0 8px;font-weight:900}

  .year{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;border:1px solid var(--line);background:rgba(8,28,42,.55);

  .year .en{color:var(--muted);font-weight:500}
  .year b{color:var(--cyan)}

  .contact-label{margin:0 0 12px;font-size:1.05rem}

  .ph{width:1.1em;height:1.1em;fill:currentColor;flex:none}
  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--cyan-700);color:#fff;text-decoration:none;font-weight:700;

  .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:700}

  .hint{margin:10px 0 0;font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .hint .en{color:var(--muted)}

  /* تأثير اللمس: ترس ومفك يتحركان */
  #fx{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
  .tap{position:absolute;display:flex;align-items:flex-end;gap:3px;pointer-events:none;filter:drop-shadow(0 0 8px rgba(41,181,230,.95));will-change:transform,opacity}
  .tg{width:46px;height:46px;color:#29B5E6}
  .td{width:15px;height:58px;color:#E6F6FC;transform-origin:50% 92%}

  /* شاشات كبيرة */
  @media (min-width:1600px){html{font-size:112.5%}}
  @media (min-width:2200px){html{font-size:137.5%}}
  /* هاتف بوضع أفقي أو شاشة قصيرة */
  @media (max-height:540px) and (orientation:landscape){
    main{padding-block:calc(14px + env(safe-area-inset-top,0px)) 14px}
    .logo{width:min(8rem,22vh*1.2)}.sections{margin:12px auto}.illus{width:min(9rem,40vh);margin-bottom:12px}
    .branches,.social{margin-top:22px}
  }
  /* شاشات صغيرة جداً (320px) */
  @media (max-width:350px){.card{padding:16px}.card li{flex-wrap:wrap}.cta{padding:12px 18px;font-size:1.05rem}}

  @media (prefers-reduced-motion:no-preference){
    .wrap>*{animation:rise .6s ease both}
    .wrap>*:nth-child(2){animation-delay:.06s}.wrap>*:nth-child(3){animation-delay:.12s}.wrap>*:nth-child(4){animation-delay:.18s}
    .wrap>*:nth-child(5){animation-delay:.24s}.wrap>*:nth-child(6){animation-delay:.3s}.wrap>*:nth-child(7){animation-delay:.36s}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  }
  @media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover,.card:focus-within,.card:active{transform:none}}
</style>

  var fx=doc.getElementById('fx');
  var T='<svg class="tg" viewBox="0 0 100 100" aria-hidden="true"><use href="#gear" x="0" y="0" width="100" height="100"/></svg><svg class="td" viewBox="0 0 24 120" aria-hidden="true"><use href="#driver" x="0" y="0" width="24" height="120"/></svg>';
  function burst(x,y){

    var e=doc.createElement('div');e.className='tap';e.style.left=x+'px';e.style.top=y+'px';e.innerHTML=T;fx.appendChild(e);

      {opacity:0,transform:'translate(-50%,-30%) scale(.4)'},
      {opacity:1,transform:'translate(-50%,-60%) scale(1)',offset:.2},
      {opacity:1,transform:'translate(-50%,-75%) scale(1)',offset:.72},

  }
